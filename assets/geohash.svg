<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">Geohash experiment: Guindy flyover to Chennai Central</title>
  <desc id="d">Guindy (Kathipara) flyover geohash tf31cpfsc and Chennai Central geohash tf346tw7p share the prefix tf3. Straight-line distance 11.38 km. Error of distance computed from geohash cell centres falls from 8.2 km at length 4 to 2.6 m at length 9.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .card{fill:#f6f8fa;stroke:#d0d7de;transition:all .2s}
    .c:hover .card{stroke:#0969da}
    .lab{fill:#59636e;font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif}
    .nm{fill:#1f2328;font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif}
    .gh{fill:#1f2328;font:600 24px Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:.06em}
    .pre{fill:#bf3989}
    .big{fill:#0969da;font:700 40px 'Segoe UI',Helvetica,Arial,sans-serif}
    .route{fill:none;stroke:#0969da;stroke-width:2;stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
    .dot{fill:#0969da}
    .hd{fill:#59636e;font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .bar{fill:#54aeff;transition:fill .15s}
    .b:hover .bar{fill:#0969da}
    .bl{fill:#1f2328;font:500 13px 'Segoe UI',Helvetica,Arial,sans-serif}
    .bv{fill:#59636e;font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){.route{animation:none}}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.c:hover .card{stroke:#4493f8}
      .lab,.hd,.bv{fill:#9198a1}.nm,.gh,.bl{fill:#e6edf3}.pre{fill:#f778ba}
      .big,.dot{fill:#4493f8}.route{stroke:#4493f8}.bar{fill:#1f6feb}.b:hover .bar{fill:#4493f8}
    }
  </style>
  <rect class="bg" x="1" y="1" width="998" height="328" rx="18"/>

  <g class="c"><rect class="card" x="28" y="32" width="250" height="110" rx="12"/>
    <text class="nm" x="48" y="62">Guindy (Kathipara) flyover</text>
    <text class="lab" x="48" y="84">13.00727° N, 80.20371° E</text>
    <text class="gh" x="48" y="124"><tspan class="pre">tf3</tspan>1cpfsc</text></g>

  <g class="c"><rect class="card" x="28" y="186" width="250" height="110" rx="12"/>
    <text class="nm" x="48" y="216">Chennai Central</text>
    <text class="lab" x="48" y="238">13.0825° N, 80.2750° E</text>
    <text class="gh" x="48" y="278"><tspan class="pre">tf3</tspan>46tw7p</text></g>

  <path class="route" d="M286 88 C 340 88, 340 240, 286 240"/>
  <circle class="dot" cx="286" cy="88" r="4"/><circle class="dot" cx="286" cy="240" r="4"/>
  <text class="big" x="352" y="158">11.38 km</text>
  <text class="lab" x="354" y="182">straight line · haversine</text>
  <text class="lab" x="354" y="202">11.36 km Vincenty · bearing 43°</text>
  <text class="lab" x="354" y="228">shared prefix <tspan class="pre" font-weight="600">tf3</tspan> = same ~150 km cell</text>

  <text class="hd" x="620" y="48">DISTANCE FROM GEOHASH CENTRES — ERROR</text>
  <g class="b"><text class="bl" x="620" y="84">4 chars</text><rect class="bar" x="690" y="70" width="230" height="20" rx="4"/><text class="bv" x="928" y="85">8.2 km</text></g>
  <g class="b"><text class="bl" x="620" y="118">5 chars</text><rect class="bar" x="690" y="104" width="160" height="20" rx="4"/><text class="bv" x="858" y="119">514 m</text></g>
  <g class="b"><text class="bl" x="620" y="152">6 chars</text><rect class="bar" x="690" y="138" width="141" height="20" rx="4"/><text class="bv" x="839" y="153">244 m</text></g>
  <g class="b"><text class="bl" x="620" y="186">7 chars</text><rect class="bar" x="690" y="172" width="90" height="20" rx="4"/><text class="bv" x="788" y="187">34 m</text></g>
  <g class="b"><text class="bl" x="620" y="220">8 chars</text><rect class="bar" x="690" y="206" width="45" height="20" rx="4"/><text class="bv" x="743" y="221">5.7 m</text></g>
  <g class="b"><text class="bl" x="620" y="254">9 chars</text><rect class="bar" x="690" y="240" width="25" height="20" rx="4"/><text class="bv" x="723" y="255">2.6 m</text></g>
  <text class="lab" x="620" y="292">log scale · 1–3 chars: both in one cell (distance = 0)</text>
</svg>
